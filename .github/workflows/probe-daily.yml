name: schedule-probe-daily

# 对照探针 A：与日报同一触发时刻，但结构最简——单 cron、单 job、无 concurrency、
# 不 checkout、不提交状态、不推送。只记录「触发 -> 实际创建」的偏移。
# 如果它偏移很小，说明主 workflow 的大延迟来自它自身的结构（多 cron / 双 job /
# concurrency / 状态提交）；如果它也延迟数小时，说明是仓库级因素。
# 验证完删除本文件。

on:
  schedule:
    - cron: "10 0 * * *"          # 与日报同刻（BJT 08:10）
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 记录偏移
        run: |
          echo "触发 event=${{ github.event_name }} schedule=${{ github.event.schedule }}"
          echo "实际创建 $(date -u +%FT%TZ)"
          echo "触发 schedule=${{ github.event.schedule }} / 创建 $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
