name: schedule-probe-hourly

# 对照探针 B：结构同样最简（单 cron、单 job、无 concurrency、无状态提交），
# 但触发密度高——每小时 :07 / :37。
# 如果它偏移很小而 A 也小，密度不是主因；如果 B 小、A 大，密度是关键变量。
# 运行 2~3 天后删除，避免刷运行记录。

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 记录偏移
        run: |
          echo "触发 event=${{ github.event_name }} schedule=${{ github.event.schedule }}"
          echo "实际创建 $(date -u +%FT%TZ)"
          echo "触发 schedule=${{ github.event.schedule }} / 创建 $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
