name: 米游社福利与签到

# 时区说明：GitHub cron 一律用 UTC；文件里所有注释标的是北京时间。
#
# 2026-11-27 改版：放弃「反推触发时刻」，改用「密集打点 + 分槽去重」。
# 实测支撑（详见 docs/slots-dispatch.md）：
#   * 28 个样本：偏移 4h07~11h46，无法用固定提前量对齐；
#   * 24 小时内约 19 个定时触发只兑现 1 次（派发率约 2%），拆分/单点写法都可能整轮被吞；
#   * 探针（单 cron/单 job/无状态提交）同样几乎不被派发——瓶颈在调度器派发，不在 workflow 结构；
#   * 派发发生时是准的（探针 +28m），所以不赌时刻，用密度换覆盖。
#
# 现在的做法：每 30 分钟一个触发点（一天 48 点），被丢弃的点不产生请求；
# 实际兑现约 4~5 次/天，每次跑完整流程，由脚本按北京时间分槽去重：
#   早报 00:00-11:59 / 午报 12:00-17:59 / 晚报 18:00-23:59，每槽每天最多一条日报。
# 新兑换码不受槽限制，随时推；签到幂等，每轮照跑（未启用则跳过）。

on:
  schedule:
    - cron: "7,37 * * * *"        # 每 30 分钟一个点（UTC；BJT +8）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只抓取，不推送、不写状态（排查用）"
        type: boolean
        default: false
      test_push:
        description: "只发一条测试推送，不抓取、不写状态"
        type: boolean
        default: false

permissions:
  contents: write                 # 提交 state/ 下的状态文件

concurrency:
  group: mihoyo-watch
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai               # 让脚本里的「今天」和槽位按北京时间

jobs:
  watch:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '7,37 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 只跑新项目的测试；不要上传 tests/test_config.py / test_models.py
      - name: 单元测试
        run: python -m unittest tests.test_watch_mihoyo tests.test_mihoyo_codes tests.test_mihoyo_comments tests.test_workflow

      - name: 随机延迟
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 180))

      # 排查用：确认这次运行由哪条 cron 触发（workflow_dispatch 时 schedule 为空）
      - name: 记录触发来源
        run: echo "触发 event=${{ github.event_name }} schedule=${{ github.event.schedule }} / 北京时间 $(TZ=Asia/Shanghai date '+%F %H:%M')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 抓取并推送
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        # pipefail：tee 不能吞掉脚本的退出码
        run: |
          set -o pipefail
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          TEST=""
          if [ "${{ inputs.test_push }}" = "true" ]; then TEST="--test-push"; fi
          if [ -n "$TEST" ]; then
            python src/watch_mihoyo.py --test-push 2>&1 | tee watch.log
          else
            python src/watch_mihoyo.py $DRY 2>&1 | tee watch.log
          fi

      - name: 提交状态
        if: always()
        run: |
          git config user.name  "codewatch-bot"
          git config user.email "codewatch-bot@users.noreply.github.com"
          git add -A -- state/seen_news.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: 更新福利监测状态 [skip ci]"
            git push
          fi

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo "## 福利监测"
            echo '```'
            tail -n 60 watch.log 2>/dev/null || echo "无日志"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  checkin:
    # 串行：两个 job 都会 commit/push，避免 non-fast-forward
    needs: watch
    # 签到必须显式开启：仓库 Variables 里设置 CHECKIN_ENABLED=true 才会跑。
    # 未开启时整个 job 跳过（不消耗时间、不签到、不发任何签到告警）。
    # 开启后若没配 CHECKIN_COOKIE，脚本会 exit 0 跳过，同样不会告警。
    # 密打后每轮兑现都跑一次；签到幂等（已签返回 -5003 算成功），重复执行无副作用。
    if: |
      always() &&
      vars.CHECKIN_ENABLED == 'true' &&
      !(github.event_name == 'workflow_dispatch' && inputs.test_push)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 随机延迟
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 180))

      - name: 米游社签到
        env:
          CHECKIN_COOKIE: ${{ secrets.CHECKIN_COOKIE }}
          CHECKIN_DEVICE_ID: ${{ secrets.CHECKIN_DEVICE_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          set -o pipefail
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python src/checkin.py $DRY 2>&1 | tee checkin.log

      - name: 提交状态
        if: always()
        run: |
          git config user.name  "codewatch-bot"
          git config user.email "codewatch-bot@users.noreply.github.com"
          git add -A -- state/checkin_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "chore: 更新签到状态 [skip ci]"
            git push
          fi

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo "## 签到"
            echo '```'
            tail -n 60 checkin.log 2>/dev/null || echo "无日志"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
